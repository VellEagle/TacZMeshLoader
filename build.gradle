plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "taczmeshloader.refmap.json"
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.ladysnake.org/releases' }
    maven { url 'https://dvs1.progwml6.com/files/maven/' }
    maven { url "https://modmaven.dev" }
    maven { url "https://maven.blamejared.com/" }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    flatDir { dir 'libs' }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // TACZ Refabricated を依存として宣言（ビルド時参照のみ）
    // 実際のJARはプレイヤーが別途導入する
    modImplementation "curse.maven:tacz-refabricated-1334246:8153691"

    modImplementation "curse.maven:accrelatedrendering-refabricated-1318010:7747166"

    // Apache Commons (Pairクラス用)
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // Mixin annotation processor
    'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(17)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
